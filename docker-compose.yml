# Local development stack.
#   docker compose up -d db          Postgres 16 with the synthetic e-commerce data + read-only role
#   docker compose --profile remote up   + the MCP server over Streamable HTTP + Keycloak (OAuth testing only)
name: mcp-postgres-sheets

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_owner_dev_only}
      POSTGRES_DB: shop
      MCP_READONLY_USER: mcp_readonly
      MCP_READONLY_PASSWORD: ${MCP_READONLY_PASSWORD:-mcp_readonly}
    ports:
      - "${DB_PORT:-5544}:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./sample_data:/sample_data:ro
      - ./deploy/sql:/deploy/sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Healthy only after the init script finished (the read-only role is created last).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop_owner -d shop && psql -h 127.0.0.1 -U shop_owner -d shop -tAc \"select 1 from pg_roles where rolname = 'mcp_readonly'\" | grep -q 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # --- remote profile: the MCP server over Streamable HTTP + a LOCAL-TESTING-ONLY Keycloak --------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    profiles: ["remote"]
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:8180
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  mcp:
    build: .
    image: mcp-postgres-sheets:dev
    profiles: ["remote"]
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TRANSPORT: http
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8765"
      PUBLIC_URL: http://localhost:8765
      HTTP_ALLOWED_HOSTS: mcp:8765
      DATABASE_URL: postgresql://mcp_readonly:${MCP_READONLY_PASSWORD:-mcp_readonly}@db:5432/shop
      # Tokens say iss=http://localhost:8180/…; inside the network the keys come from keycloak:8080.
      OAUTH_ISSUER: http://localhost:8180/realms/mcp
      OAUTH_JWKS_URL: http://keycloak:8080/realms/mcp/protocol/openid-connect/certs
      OAUTH_AUDIENCE: mcp-postgres-sheets
      SHEETS_BACKEND: ${SHEETS_BACKEND:-memory}
      ALLOWED_SHEET_IDS: ${ALLOWED_SHEET_IDS:-demo-sales-pipeline}
      READ_ONLY: "false"
      RATE_LIMIT_PER_MIN: "60"
    ports:
      - "8765:8765"
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
