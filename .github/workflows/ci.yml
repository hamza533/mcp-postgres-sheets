name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, type-check, test (real Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.30"
          enable-cache: true
      - run: uv python install
      - run: make setup
      - run: make check
      - name: safety suite report
        run: make eval-safety
      - name: package builds and installs with uvx
        run: |
          make build
          uvx --from dist/*.whl mcp-postgres-sheets --version

  remote-e2e:
    name: remote mode end-to-end (Keycloak + OAuth)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.30"
          enable-cache: true
      - run: uv python install
      - run: make setup
      - run: docker compose --profile remote up -d --build --wait
      - run: make remote-smoke
      - if: failure()
        run: docker compose --profile remote logs --no-color
      - if: always()
        run: docker compose --profile remote down -v

  image:
    name: Docker image build + vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mcp-postgres-sheets:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image runs as non-root and starts
        run: |
          test "$(docker image inspect mcp-postgres-sheets:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm mcp-postgres-sheets:ci --version
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-postgres-sheets:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
