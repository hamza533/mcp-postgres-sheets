name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, type-check, test (real Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.30"
          enable-cache: true
      - run: uv python install
      - run: make setup
      - run: make check
      - name: safety suite report
        run: make eval-safety
      - name: package builds and installs with uvx
        run: |
          make build
          uvx --from dist/*.whl mcp-postgres-sheets --version

  remote-e2e:
    name: remote mode end-to-end (Keycloak + OAuth)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.30"
          enable-cache: true
      - run: uv python install
      - run: make setup
      - run: docker compose --profile remote up -d --build --wait
      - run: make remote-smoke
      - if: failure()
        run: docker compose --profile remote logs --no-color
      - if: always()
        run: docker compose --profile remote down -v

  image:
    name: Docker image build + vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: mcp-postgres-sheets:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image runs as non-root and starts
        run: |
          test "$(docker image inspect mcp-postgres-sheets:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm mcp-postgres-sheets:ci --version
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-postgres-sheets:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  site:
    name: website (generated reference up to date, lint, types, build, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.30"
          enable-cache: true
      - name: tools reference matches tools/list (fails if out of date)
        working-directory: .
        run: |
          uv python install
          uv sync --frozen
          uv run python -m scripts.export_tools site/src/data --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: site/playwright-report

  bicep:
    name: Azure production profile (Bicep build + lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install Bicep CLI v0.49.2
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/download/v0.49.2/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
      - run: bicep build deploy/azure/main.bicep --stdout > /dev/null
      - name: bicep lint (any warning fails)
        run: |
          bicep lint deploy/azure/main.bicep --diagnostics-format sarif > bicep-lint.sarif
          python3 -c "import json,sys; r=json.load(sys.stdin)['runs'][0]['results']; [print(x['message']['text']) for x in r]; sys.exit(1 if r else 0)" < bicep-lint.sarif
      - run: bicep build-params deploy/azure/main.bicepparam --stdout > /dev/null
